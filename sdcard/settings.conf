# PhotoPainter RP2040 firmware 0.4.0
orientation=0
refresh_minutes=720
shuffle=false
# Same start/end disables quiet hours; quiet period may cross midnight.
quiet_hours_start=00:00
quiet_hours_end=00:00

# ACT lights up while an image loads/converts/refreshes (including on battery).
# Set false to save some energy during long E Ink refreshes.
activity_led=true

# Physical AUTO-NEXT gates RTC wake-up on battery (not readable through GPIO).
# USB keeps the MCU powered: disable timed cycling by default to avoid
# overriding AUTO-NEXT OFF. Set true to cycle while USB is connected.
usb_auto_next=false

# Both BMP and JPEG resize to fit 800x480 or 480x800.
# contain = whole picture / white borders. cover = fill / crop center.
image_fit=contain
# Progressive JPEG is decoded at 1/8 resolution for compatibility.
# Use PhotoPainter Studio Web and export EPD for full-quality frames.
progressive_jpeg=preview

# Persistent /cache/*.epc: one pre-converted 7-color 800x480 frame per image.
cache_enabled=true
# Avoid full display refresh when an image is identical to what is visible.
skip_unchanged=true
# No need for periodic wake when there is only one photo.
# Change to false if you want periodic rescans of the SD card.
single_image_auto_pause=true
# Avoid 192 KB SD write when battery is nearly depleted.
cache_write_min_v=3.6
# Optional ADC correction, multiply measured battery voltage (0.85..1.15).
battery_calibration=1.000

low_battery_v=3.4
critical_cutoff_v=3.1
